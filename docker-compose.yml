name: conductor

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CONDUCTOR_HOST: 0.0.0.0
      CONDUCTOR_DATABASE_URL: sqlite:////data/conductor.db
    ports:
      - "8080:8080"
    volumes:
      - conductor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command:
      - conductor-worker
      - --api-url
      - http://api:8080/api/v1
      - --worker-id
      - compose-fixture-worker
      - --task
      - text.generate
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  conductor-data:
