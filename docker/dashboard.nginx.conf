server {
    listen 80;
    server_name _;

    # The browser keeps using same-origin /api/v1 URLs. Nginx forwards them to
    # the control-plane container, so Docker users do not need to configure CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite builds a single-page application. Unknown browser routes must return
    # its entry document rather than a web-server 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
