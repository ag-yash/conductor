[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "conductor-ai"
version = "0.5.0"
description = "Local-first, resource-aware AI workload management infrastructure."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Conductor contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "psutil>=6,<8",
  "sqlmodel>=0.0.24,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
conductor-api = "conductor.main:run"
conductor = "conductor.cli.main:main"
conductor-worker = "conductor.workers.runner:main"

[project.optional-dependencies]
dev = [
  "black>=24.10,<26",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "httpx2>=2.7,<3",
  "ruff>=0.8,<1",
  "types-psutil>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/conductor"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]
extend-exclude = ["sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
exclude = ["^sources/"]
mypy_path = "backend/src"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["backend/src"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["conductor"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
